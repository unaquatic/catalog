name: Build Site
description: Assemble the static catalog browser under site/catalog, from the page, the committed catalog in data/catalog, joined into one catalog.json, and its JSON Schema

runs:
  using: composite
  steps:
    # The page fetches the relative catalog.json, so it works under any
    # path that ends in a slash: /catalog/ on GitHub Pages and aquatic.dev.
    # GitHub Pages publishes site/catalog; the worker serves site, so that its
    # files sit under /catalog/ as its routes do. schema.json is the
    # catalog's "$schema", gateway.SchemaURL.
    - name: Setup
      uses: ./.github/actions/setup

    - name: Assemble Site
      shell: bash
      run: |
        rm -rf site
        mkdir -p site/catalog
        cp cmd/catalog/index.html site/catalog/
        go run ./cmd/catalog join -catalog data/catalog -o site/catalog/catalog.json
        cp gateway/catalog.schema.json site/catalog/schema.json
        printf '%s\n' \
          '/catalog/catalog.json' \
          '  Cache-Control: public, max-age=300' \
          '  Access-Control-Allow-Origin: *' \
          '/catalog/schema.json' \
          '  Content-Type: application/schema+json' \
          '  Cache-Control: public, max-age=300' \
          '  Access-Control-Allow-Origin: *' \
          > site/_headers
        jq -e '.version and (.models | length > 0)' site/catalog/catalog.json > /dev/null
        [ "$(jq -r '."$schema"' site/catalog/catalog.json)" = "$(jq -r '."$id"' site/catalog/schema.json)" ]
