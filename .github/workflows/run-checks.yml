name: Run Checks

on:
  workflow_dispatch:

  workflow_call:
    inputs:
      ref:
        description: "Git ref to check, or empty for the triggering commit"
        type: string
        default: ""

concurrency:
  group: run-checks-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Format Check
        run: |
          unformatted=$(gofmt -l .)
          [ -z "$unformatted" ] || { echo "gofmt needed:" >&2; echo "$unformatted" >&2; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
