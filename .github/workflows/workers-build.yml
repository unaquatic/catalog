name: Workers Build

on:
  workflow_dispatch:

  workflow_call:
    inputs:
      ref:
        description: "Git ref to deploy, or empty for the triggering commit"
        type: string
        default: ""

concurrency:
  group: workers-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Build Site
        uses: ./.github/actions/build-site

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            [ -n "${!key}" ] || { echo "missing secret $key" >&2; exit 1; }
          done
          npx --yes wrangler@4 deploy \
            --tag "$(git rev-parse HEAD)" \
            --message "$(git log -1 --pretty=%s)"
