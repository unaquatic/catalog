name: CI Develop

run-name: Deploy ${{ github.sha }}

# A push to main deploys the page and the committed data/catalog.json as they
# are. Refresh's data commits do not start this workflow, as no push by
# GITHUB_TOKEN does; Refresh deploys them through Release.
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Check
    uses: ./.github/workflows/run-checks.yml
    secrets: inherit

  # GitHub Pages needs a public repository on the free plan; set the
  # repository variable PAGES to true once it is public.
  deploy-pages:
    name: Deploy Pages
    needs: check
    if: vars.PAGES == 'true'
    uses: ./.github/workflows/pages-deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    secrets: inherit

  deploy-workers:
    name: Deploy Workers
    needs: check
    uses: ./.github/workflows/workers-build.yml
    secrets: inherit
