name: Pages Deploy

on:
  workflow_dispatch:

  workflow_call:
    inputs:
      ref:
        description: "Git ref to deploy, or empty for the triggering commit"
        type: string
        default: ""

concurrency:
  group: pages-deploy
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Build Site
        uses: ./.github/actions/build-site

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # The project site is served at /catalog/ already, so the artifact is
      # the catalog directory itself.
      - name: Upload Site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/catalog

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deploy
        uses: actions/deploy-pages@v5
